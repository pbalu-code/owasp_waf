---
- name: Prepare
  hosts: all
  gather_facts: yes
  become: true
  roles:
  tasks:
    - name: Install apache2
      ansible.builtin.apt:
        update_cache: yes
        name:
          - apache2
          - apache2-utils
          - libapache2-mod-fcgid
        state: present
    - name: Enable required apache2 modules
      ansible.builtin.apache2_module:
        name: "{{ item }}"
        state: present
      loop:
        - proxy_fcgi
        - setenvif
        - status
        - headers
        - proxy
        - proxy_http
        - rewrite

    - name: Ensure apache2 is restarted and enabled
      ansible.builtin.service:
        name: apache2
        state: restarted
        enabled: true 

